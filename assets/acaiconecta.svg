<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="Projeto AçaíConecta — em desenvolvimento">
  <!--
    Para atualizar o status: edite os textos das etapas abaixo e,
    na etapa concluída, troque fill="#30363d" por fill="#3ddc97" no círculo.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#1c0f2b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b3fa0"/>
      <stop offset="1" stop-color="#3ddc97"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: Consolas, 'DejaVu Sans Mono', 'SFMono-Regular', Menlo, monospace; }
    .fill { transform-origin: 40px 0; transform: scaleX(0); animation: grow 1.6s cubic-bezier(.2,.8,.2,1) .4s forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .step { opacity: 0; animation: in .5s ease-out forwards; }
    .s1 { animation-delay: .5s; } .s2 { animation-delay: .7s; } .s3 { animation-delay: .9s; } .s4 { animation-delay: 1.1s; }
    @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
  </style>

  <rect x="0.5" y="0.5" width="879" height="259" rx="16" fill="url(#bg)" stroke="#30363d"/>

  <!-- cabeçalho -->
  <text x="40" y="58" class="sans" font-size="26" font-weight="700" fill="#f0e6ff">AçaíConecta</text>
  <g>
    <rect x="670" y="36" width="170" height="26" rx="13" fill="#3ddc97" fill-opacity="0.12" stroke="#3ddc97" stroke-opacity="0.5"/>
    <circle class="pulse" cx="686" cy="49" r="4.5" fill="#3ddc97"/>
    <text x="698" y="54" class="sans" font-size="13" font-weight="600" fill="#bff5dc">em desenvolvimento</text>
  </g>
  <text x="40" y="92" class="sans" font-size="16" fill="#b1bac4">Plataforma de delivery que conecta as batedeiras tradicionais de açaí de Cametá (PA) aos clientes.</text>

  <!-- progresso -->
  <rect x="40" y="116" width="800" height="6" rx="3" fill="#30363d"/>
  <rect class="fill" x="40" y="116" width="400" height="6" rx="3" fill="url(#bar)"/>

  <!-- etapas -->
  <g class="sans" font-size="15">
    <g class="step s1"><circle cx="48"  cy="156" r="7" fill="#3ddc97"/><text x="64"  y="161" fill="#e6edf3">PRD (documento de requisitos)</text></g>
    <g class="step s2"><circle cx="448" cy="156" r="7" fill="#3ddc97"/><text x="464" y="161" fill="#e6edf3">Modelagem do banco em PostgreSQL</text></g>
    <g class="step s3"><circle cx="48"  cy="190" r="7" fill="none" stroke="#c9a8f5" stroke-width="2"/><text x="64"  y="195" fill="#b1bac4">Protótipo no Figma</text></g>
    <g class="step s4"><circle cx="448" cy="190" r="7" fill="none" stroke="#c9a8f5" stroke-width="2"/><text x="464" y="195" fill="#b1bac4">Inicialização da stack</text></g>
  </g>

  <!-- tags -->
  <g class="mono" font-size="12.5">
    <rect x="40"  y="218" width="92" height="24" rx="6" fill="#336791" fill-opacity="0.25"/><text x="86"  y="234" text-anchor="middle" fill="#9cc3e6">PostgreSQL</text>
    <rect x="140" y="218" width="80" height="24" rx="6" fill="#3ecf8e" fill-opacity="0.18"/><text x="180" y="234" text-anchor="middle" fill="#8ee6bd">Supabase</text>
    <rect x="228" y="218" width="62" height="24" rx="6" fill="#a259ff" fill-opacity="0.22"/><text x="259" y="234" text-anchor="middle" fill="#d2b3ff">Figma</text>
  </g>
</svg>
