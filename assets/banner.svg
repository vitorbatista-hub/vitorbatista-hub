<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Vitor Benedito Ribeiro Batista — Estudante de Sistemas de Informação na UFPA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.6" stop-color="#140c1f"/>
      <stop offset="1" stop-color="#1c0f2b"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0e6ff"/>
      <stop offset="0.55" stop-color="#c9a8f5"/>
      <stop offset="1" stop-color="#3ddc97"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c9a8f5"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    .mono { font-family: Consolas, 'DejaVu Sans Mono', 'SFMono-Regular', Menlo, monospace; }
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }

    .blob1 { animation: drift1 14s ease-in-out infinite alternate; }
    .blob2 { animation: drift2 18s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(120px,40px); } }
    @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-140px,-30px); } }

    .prompt { opacity: 0; animation: fade .6s ease-out .2s forwards; }
    .cmd    { clip-path: inset(0 100% 0 0); animation: type 1.1s steps(6) .8s forwards; }
    .name   { opacity: 0; animation: rise .8s cubic-bezier(.2,.8,.2,1) 2.1s forwards; }
    .sub    { opacity: 0; animation: rise .8s cubic-bezier(.2,.8,.2,1) 2.5s forwards; }
    .chip   { opacity: 0; animation: rise .6s cubic-bezier(.2,.8,.2,1) forwards; }
    .c1 { animation-delay: 2.9s; } .c2 { animation-delay: 3.05s; } .c3 { animation-delay: 3.2s; } .c4 { animation-delay: 3.35s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .orbit  { transform-origin: 1030px 160px; animation: spin 40s linear infinite; }
    .orbit2 { transform-origin: 1030px 160px; animation: spin 26s linear infinite reverse; }

    @keyframes fade  { to { opacity: 1; } }
    @keyframes type  { to { clip-path: inset(0 0 0 0); } }
    @keyframes rise  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes spin  { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; clip-path: none !important; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)" opacity="0.07"/>
    <circle class="blob1" cx="260" cy="60" r="150" fill="#7b3fa0" opacity="0.45" filter="url(#blur)"/>
    <circle class="blob2" cx="980" cy="280" r="160" fill="#3ddc97" opacity="0.18" filter="url(#blur)"/>

    <!-- órbita decorativa -->
    <g opacity="0.55">
      <circle cx="1030" cy="160" r="92" fill="none" stroke="#c9a8f5" stroke-opacity="0.25" stroke-dasharray="3 7"/>
      <circle cx="1030" cy="160" r="58" fill="none" stroke="#3ddc97" stroke-opacity="0.25"/>
      <g class="orbit"><circle cx="1122" cy="160" r="6" fill="#c9a8f5"/></g>
      <g class="orbit2"><circle cx="1030" cy="102" r="4" fill="#3ddc97"/></g>
      <text x="1030" y="172" text-anchor="middle" class="mono" font-size="34" fill="#c9a8f5" fill-opacity="0.8">{ }</text>
    </g>

    <!-- terminal -->
    <text x="72" y="84" class="mono" font-size="18">
      <tspan class="prompt" fill="#3ddc97">vitor@ufpa</tspan><tspan class="prompt" fill="#8b949e">:~$ </tspan><tspan class="cmd" fill="#e6edf3">whoami</tspan>
    </text>

    <text x="70" y="160" class="sans name" font-size="50" font-weight="700" fill="url(#name)" letter-spacing="-0.5">Vitor Benedito Ribeiro Batista<tspan class="cursor" fill="#3ddc97" font-weight="400"> ▍</tspan></text>

    <text x="72" y="202" class="sans sub" font-size="20" fill="#b1bac4">Estudante de Sistemas de Informação · Universidade Federal do Pará</text>

    <!-- interesses -->
    <g class="sans" font-size="15" font-weight="600">
      <g class="chip c1"><rect x="72"  y="232" width="104" height="34" rx="17" fill="#7b3fa0" fill-opacity="0.22" stroke="#c9a8f5" stroke-opacity="0.45"/><text x="124" y="254" text-anchor="middle" fill="#e2d4fa">Backend</text></g>
      <g class="chip c2"><rect x="188" y="232" width="118" height="34" rx="17" fill="#7b3fa0" fill-opacity="0.22" stroke="#c9a8f5" stroke-opacity="0.45"/><text x="247" y="254" text-anchor="middle" fill="#e2d4fa">IA &amp; LLMs</text></g>
      <g class="chip c3"><rect x="318" y="232" width="104" height="34" rx="17" fill="#3ddc97" fill-opacity="0.12" stroke="#3ddc97" stroke-opacity="0.45"/><text x="370" y="254" text-anchor="middle" fill="#bff5dc">Android</text></g>
      <g class="chip c4"><rect x="434" y="232" width="78"  height="34" rx="17" fill="#3ddc97" fill-opacity="0.12" stroke="#3ddc97" stroke-opacity="0.45"/><text x="473" y="254" text-anchor="middle" fill="#bff5dc">Web</text></g>
    </g>
  </g>
</svg>
