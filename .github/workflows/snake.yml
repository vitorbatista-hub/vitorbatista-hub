name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#3ddc97&color_dots=#161b22,#3b1f52,#5a2d7c,#7b3fa0,#c9a8f5
            dist/snake-light.svg?color_snake=#7b3fa0&color_dots=#ebedf0,#e2d4fa,#c9a8f5,#9b6bc9,#7b3fa0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
